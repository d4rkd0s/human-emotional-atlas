name: Validate atlas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate dataset and graph
        run: python3 scripts/validate.py
      - name: Test validation and deterministic builds
        run: python3 -m unittest discover -s tests -v
      - name: Build static explorer
        run: python3 scripts/build.py
